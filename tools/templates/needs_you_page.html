<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;1,400&family=Inter:wght@400;500&family=DM+Mono:wght@500&display=swap">
<style>
:root{--paper:#F6F1E5;--raised:#FCFAF5;--quiet:#E8E7DC;--rule:rgba(16,31,36,.12);--ink:#101F24;--muted:#374E4A;--weak:#516962;
 --ember:#F47743;--ember-ink:#A13E25;--ok:#2F6B4F;--shade:rgba(16,31,36,.38);--area:#E8E7DC;--area-line:rgba(16,31,36,.28);
 --c1:#309b79;--c2:#6859a8;--c3:#b28218;--o1:#668b99;--o2:#335d76;--o3:#1b344b;
 --serif:"Crimson Pro",Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#101F2D;--raised:#152939;--quiet:#0c1822;--rule:rgba(246,241,229,.14);
 --ink:#F6F1E5;--muted:#B4C0B9;--weak:#93A39D;--ember-ink:#F58A57;--ok:#7FC3A0;--shade:rgba(0,0,0,.55);--area:#1B344B;--area-line:rgba(246,241,229,.3);
 --o1:#335d76;--o2:#4f7f93;--o3:#8fabaf}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--quiet);color:var(--ink);font:400 16px/1.45 var(--sans)}
a{color:inherit}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:12px;z-index:9;background:var(--raised);padding:8px 12px;border-radius:8px}
.top{max-width:1240px;margin:0 auto;padding:22px 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font:500 12px var(--mono);letter-spacing:.06em;color:var(--weak)}
h1{font:400 40px/1.05 var(--serif);margin:6px 0 2px;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted);font-size:15px}
.custom-btn{border:1px solid var(--rule);background:var(--raised);color:var(--ink);font:500 14px var(--sans);padding:10px 14px;border-radius:11px;cursor:pointer;min-height:44px}
.grid{max-width:1240px;margin:0 auto;padding:14px 20px 110px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.mod{grid-column:span 12;background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:18px 18px 16px;min-width:0}
.mod > h2{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--weak);margin:0 0 12px;display:flex;justify-content:space-between;gap:8px}
.mod > h2 span{text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:400}
@media (min-width:1000px){
  /* Two columns that stack independently, so a long list on one side leaves no hole on the other. */
  .grid{grid-template-columns:minmax(0,4fr) minmax(0,8fr)}
  .stack{display:flex;flex-direction:column;gap:16px;min-width:0}
  .tabs{display:none!important}
}
.section{margin:16px 0 8px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--weak)}
.section:first-child{margin-top:0}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--raised);border:1px solid var(--rule);border-radius:14px;padding:14px 14px 12px;transition:opacity .25s}
.card.gone{opacity:0}
.kind{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ember-ink);margin-bottom:5px}
.card h3{font:400 20px/1.2 var(--serif);margin:0 0 5px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.primary{border:0;background:var(--ember);color:#101F2D;font:500 15px var(--sans);padding:10px 15px;border-radius:11px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.primary.calm{background:var(--ink);color:var(--paper)}
.ghost{border:1px solid var(--rule);background:transparent;color:var(--muted);font:500 14px var(--sans);padding:9px 13px;border-radius:11px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.empty{padding:14px 4px;color:var(--muted);font:400 19px var(--serif)}
.note{font-size:13px;color:var(--weak);margin:10px 0 0}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.skill{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.skill b{display:block;font:400 17px/1.2 var(--serif)}
.skill span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.skill i{font-style:normal;color:var(--weak)}
.map{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:1000px){.area-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 24px;align-items:start}
  .area-panel > .kind,.area-panel > h3{grid-column:1}.area-panel > p{grid-column:1}.area-panel > ul{grid-column:2;grid-row:1 / span 3;margin-top:0}.area-panel > button{grid-column:1;justify-self:start}}
.map svg{width:100%;height:auto;display:block;background:var(--raised);border:1px solid var(--rule);border-radius:14px}
.map svg text{font:400 17px var(--sans);fill:var(--ink);pointer-events:none}
.map svg .count{font:500 13px var(--mono);fill:var(--weak)}
.map svg circle{fill:var(--area);stroke:var(--area-line);stroke-width:1;cursor:pointer;transition:fill .2s}
.map svg circle:hover,.map svg g.on circle{fill:var(--ember)}
.map svg g.on text{fill:#101F2D}
.map svg line{stroke:var(--area-line);stroke-linecap:round}
.area-panel{background:var(--raised);border:1px solid var(--rule);border-radius:14px;padding:14px}
.area-panel h3{font:400 22px/1.15 var(--serif);margin:0 0 6px}
.area-panel ul{margin:8px 0 12px;padding-left:18px;color:var(--muted)}
.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check-list li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.check-list .mark{font:500 13px var(--mono);color:var(--weak);min-width:18px}
.check-list .done .mark{color:var(--ok)}
.check-list .done .lab{color:var(--weak);text-decoration:line-through}
.check-list .lab{flex:1}
.bar{height:6px;background:var(--quiet);border-radius:3px;margin:0 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.stat{font:400 30px/1 var(--serif)}.stat small{font:400 13px var(--sans);color:var(--muted);margin-left:6px}
.stats{display:flex;gap:22px;margin-bottom:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{font:500 12px var(--mono);border:1px solid var(--rule);border-radius:99px;padding:4px 9px;color:var(--muted)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(420px,calc(100vw - 24px));display:flex;gap:4px;background:var(--raised);border:1px solid var(--rule);border-radius:16px;padding:5px;box-shadow:0 6px 24px var(--shade);z-index:4}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:500 13.5px var(--sans);padding:10px 4px;border-radius:11px;cursor:pointer;min-height:44px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
@media (max-width:999px){.stack{display:contents}.mod{display:none}.mod.tab-on{display:block}.top h1{font-size:34px}}
.shade{position:fixed;inset:0;background:var(--shade);display:none;align-items:flex-end;justify-content:center;z-index:5}
@media (min-width:700px){.shade{align-items:center}}
.shade.open{display:flex}
.sheet{width:100%;max-width:480px;background:var(--raised);border-radius:22px;padding:20px 18px 24px;max-height:86vh;overflow:auto}
.sheet h3{font:400 26px/1.15 var(--serif);margin:4px 0 8px}
.sheet p{color:var(--muted);margin:0 0 12px}
.pair{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}
.pair > div{border:1px solid var(--rule);border-radius:12px;padding:12px}
.pair b{font:400 18px var(--serif);display:block;margin-bottom:4px}
.check{display:inline-block;font:500 11px var(--mono);letter-spacing:.06em;color:var(--ok);margin-bottom:10px}
.say{font:400 italic 19px/1.35 var(--serif);border-left:3px solid var(--ember);padding:4px 0 4px 12px;margin:6px 0 14px;user-select:all}
.field{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font:400 16px var(--sans);margin:4px 0 14px}
.howto{font-size:13px;color:var(--weak);margin-top:12px}
.cust li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule)}
.cust ul{list-style:none;margin:6px 0 14px;padding:0}
.cust label{display:flex;gap:10px;align-items:center;flex:1;cursor:pointer}
.cust .mv{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(92vw,420px);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;font-size:14px;display:none;z-index:9}
.toast.show{display:block}
.chart{position:relative;margin:6px 0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.plot{position:relative;height:170px;margin:0 64px 0 30px}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plot .grid-line{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
.plot .ln{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.tick{position:absolute;font:500 11px var(--mono);color:var(--weak);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick.y{left:-30px;transform:translateY(-50%);width:26px;text-align:right}
.tick.x{top:100%;margin-top:6px;transform:translateX(-50%)}
.end{position:absolute;left:100%;margin-left:8px;transform:translateY(-50%);font-size:12.5px;color:var(--ink);white-space:nowrap}
.xband{height:24px}
.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--weak);pointer-events:none}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--raised);pointer-events:none}
.hit{position:absolute;inset:0;cursor:crosshair}
.hit:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:4px}
.tip{position:fixed;z-index:8;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.4;padding:8px 10px;border-radius:9px;pointer-events:none;max-width:240px;display:none}
.tip b{font-weight:500}
.cols{display:flex;align-items:flex-end;gap:6px;height:240px;border-bottom:1px solid var(--rule)}
.col{flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:2px;cursor:default;min-width:0;justify-content:flex-start}
.col i{display:block;width:100%;min-height:0}
.col i.top{border-radius:4px 4px 0 0}
.col:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.xl{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--weak);margin:6px 0 0}
.hbar{display:flex;gap:2px;height:14px;margin:4px 0 6px}
.hbar i{display:block;height:100%}.hbar i:first-child{border-radius:4px 0 0 4px}.hbar i:last-child{border-radius:0 4px 4px 0}.hbar i:only-child{border-radius:4px}
.rows{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13.5px;color:var(--muted);margin:0 0 14px}
.rows b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.tbl-btn{border:0;background:none;color:var(--weak);font:500 12.5px var(--sans);padding:6px 0;min-height:32px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
table.data{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
table.data th,table.data td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--rule)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{font:500 11px var(--mono);color:var(--weak);letter-spacing:.04em}
.tablewrap{max-height:260px;overflow:auto}
.flow{display:flex;flex-direction:column;align-items:center;gap:0;margin:4px 0 12px}
.flow .tier{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.flow .node{border:1px solid var(--rule);background:var(--raised);border-radius:12px;padding:8px 12px;font:400 16px/1.2 var(--serif);text-align:center}
.flow .node.me{background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:18px;padding:10px 16px}
.flow .arrow{display:flex;flex-direction:column;align-items:center;color:var(--weak);font:500 11px var(--mono);letter-spacing:.06em;padding:4px 0}
.flow .arrow::before{content:"";width:1px;height:16px;background:var(--area-line)}
.flow .arrow::after{content:"";width:0;height:0;border:5px solid transparent;border-top:6px solid var(--area-line);border-bottom:0}
.flow .arrow span{padding:3px 0}
@media (prefers-reduced-motion:reduce){.card,.map svg circle{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#grid">Skip to your wiki</a>
<header class="top">
  <div>
    <div class="brand" id="built"></div>
    <h1 id="hello"></h1>
    <p class="sub" id="count"></p>
  </div>
  <button class="custom-btn" id="customise" type="button">Customise</button>
</header>
<main class="grid" id="grid"></main>
<nav class="tabs" aria-label="Views">
  <button data-tab="needs" aria-pressed="true">Needs you</button><button data-tab="cando" aria-pressed="false">Can do</button><button data-tab="more" aria-pressed="false">Overview</button>
</nav>
<div class="shade" id="shade" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const DATA = __DATA__;
const NAME = __NAME__;
const BUILT = __BUILT__;
const KIND = {proposal:"A change ready for you",contradiction:"A decision",stand_behind:"Stand behind a page",
  broken:"Something is broken",waits:"Waiting on someone",questions:"Open questions",
  quotes:"A check",overview:"Your overview",never_proposed:"Unsaved work",clash:"Needs updating first",suggestion:"A suggestion"};
const GROUPS = [["yes","Say yes"],["concern","Concerns"],["todo","To do"]];
// The modules, in their default order. size: how wide on a big screen. tab: where it sits on a phone.
const MODULES = [
  {id:"needs", title:"Needs you", size:"narrow", tab:"needs"},
  {id:"map", title:"Your wiki at a glance", size:"wide", tab:"more"},
  {id:"onboarding", title:"Getting started", size:"narrow", tab:"more"},
  {id:"growth", title:"How your wiki grew", size:"wide", tab:"more"},
  {id:"work", title:"What kind of work", size:"wide", tab:"more"},
  {id:"trust", title:"Who stands behind it", size:"narrow", tab:"more"},
  {id:"moved", title:"What moved this week", size:"narrow", tab:"more"},
  {id:"travels", title:"How your work travels", size:"narrow", tab:"more"},
  {id:"cando", title:"Your wiki can do", size:"wide", tab:"cando"},
];
const LAYOUT_KEY = "needs-you-layout-v1";   // layout only: which modules show, in what order. Never content.
let layout = (function(){ try { const l = JSON.parse(localStorage.getItem(LAYOUT_KEY)); if (l && Array.isArray(l.order)) return l; } catch(e){} return {order: MODULES.map(m => m.id), hidden: []}; })();
function saveLayout(){ try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch(e){} }
let later = [], done = [], tab = "needs";
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function link(href, text, cls){ const a = el("a", cls === undefined ? "ghost" : cls, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3800); }
function closeSheet(){ document.getElementById("shade").classList.remove("open"); }
document.getElementById("shade").addEventListener("click", e => { if (e.target.id === "shade") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
function openSheet(build){ const s = document.getElementById("sheet"); s.replaceChildren(); build(s); document.getElementById("shade").classList.add("open"); (s.querySelector(".primary,.field,.ghost") || s).focus(); }
function handoff(words, kind){
  openSheet(s => {
    const h = el("h3", null, "Do it in Claude"); h.id = "sh";
    s.append(el("div", "kind", kind || "Hand over to Claude"), h, el("p", null, "These words go to Claude Code, working in your wiki:"), el("div", "say", words));
    const row = el("div", "row"), copy = el("button", "primary calm", "Copy the words");
    copy.onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(words) : Promise.reject()).then(() => toast("Copied. Paste them into Claude Code in your wiki."), () => toast("Select the words above to copy them.")); };
    const no = el("button", "ghost", "Not now"); no.onclick = closeSheet;
    row.append(copy, link("https://claude.ai/code", "Open Claude"), no); s.append(row);
    s.append(el("p", "howto", "Anything Claude changes comes back to Needs you as a change for your yes."));
  });
}
function act(item, card){
  const a = item.action;
  if (a.type === "yes") openSheet(s => {
    const h = el("h3", null, "Save this into your wiki?"); h.id = "sh";
    s.append(el("div", "kind", "A change ready for you"), h, el("span", "check", "✓ CHECKS PASSED"), el("p", null, item.title), el("p", null, item.why));
    const row = el("div", "row"), no = el("button", "ghost", "Not yet"); no.onclick = closeSheet;
    row.append(link(a.target, "Open it on GitHub", "primary"), no); s.append(row);
    s.append(el("p", "howto", "GitHub opens the proposed change. Sign in if it asks, scroll down to the green “Merge pull request” button and press it, then press “Confirm merge”. That saves it into your wiki."));
  });
  else if (a.type === "decide") openSheet(s => {
    const h = el("h3", null, "Which one wins?"); h.id = "sh";
    s.append(el("div", "kind", "A decision"), h, el("p", null, "The other page stays readable, with a note pointing to the one that won."));
    const pair = el("div", "pair"), [p1, p2] = a.pages;
    for (const [pg, other] of [[p1, p2], [p2, p1]]) { const d = el("div"); d.append(el("b", null, pg.title)); if (pg.says) d.append(el("p", null, pg.says));
      const row = el("div", "row"), b = el("button", "primary calm", "This one wins");
      b.onclick = () => handoff("In the disagreement between “" + pg.title + "” and “" + other.title + "”, “" + pg.title + "” wins. Record it on the page that loses.", "A decision");
      row.append(b); if (DATA.links[pg.title]) row.append(link(DATA.links[pg.title], "Read it")); d.append(row); pair.append(d); }
    const no = el("button", "ghost", "Not yet"); no.onclick = closeSheet; s.append(pair, no);
  });
  else if (a.type === "confirm") openSheet(s => {
    const h = el("h3", null, "Do you stand behind this page?"); h.id = "sh";
    s.append(el("div", "kind", "Stand behind a page"), h, el("p", null, item.why), el("p", null, "Read it first. Then Claude records that you stand behind it."));
    const row = el("div", "row"); if (DATA.links[a.page]) row.append(link(DATA.links[a.page], "Read it on GitHub", "primary calm"));
    const yes = el("button", "ghost", "I stand behind it"); yes.onclick = () => handoff("I have read “" + a.page + "” and I stand behind it. Record that I validated it.", "Stand behind a page");
    row.append(yes); s.append(row);
  });
  else if (a.say) handoff(a.say, KIND[item.kind]);
}

// ---------------------------------------------------------------- chart helpers
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const day = iso => { const [y, m, d] = iso.split("-").map(Number); return d + " " + MON[m - 1]; };
const tip = el("div", "tip"); tip.setAttribute("role", "status"); document.body.append(tip);
function showTip(html, x, y){ tip.replaceChildren(...html); tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x - w / 2)) + "px"; tip.style.top = Math.max(8, y - h - 12) + "px"; }
function hideTip(){ tip.style.display = "none"; }
function tipLines(title, pairs){ const out = [el("b", null, title)]; for (const [k, v] of pairs) out.push(el("br"), document.createTextNode(v + " " + k)); return out; }
function legend(entries){ const l = el("div", "legend"); for (const [label, color] of entries) { const s = el("span"), sw = el("i", "sw"); sw.style.background = color; s.append(sw, label); l.append(s); } return l; }
function niceMax(v){ if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
// Every chart has a table twin, so no number is reachable only by hovering.
function tableToggle(box, head, rows){
  const b = el("button", "tbl-btn", "Show as a table"), wrap = el("div", "tablewrap"), t = el("table", "data"), tr = el("tr");
  head.forEach(h => tr.append(el("th", null, h))); const th = el("thead"); th.append(tr); t.append(th); const tb = el("tbody");
  rows.forEach(r => { const row = el("tr"); r.forEach(c => row.append(el("td", null, String(c)))); tb.append(row); }); t.append(tb);
  wrap.append(t); wrap.hidden = true;
  b.onclick = () => { wrap.hidden = !wrap.hidden; b.textContent = wrap.hidden ? "Show as a table" : "Hide the table"; };
  box.append(b, wrap);
}

        if (d > want) { const f = (d - want) / d * 0.004 * Math.min(5, l.weight); p.x += dx * f; p.y += dy * f; q.x -= dx * f; q.y -= dy * f; } }

      for (let pass = 0; pass < 3; pass++) for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {

function render(){
  document.getElementById("built").textContent = "Updated " + BUILT;
  document.getElementById("hello").textContent = NAME;
  const live = DATA.items.filter((_, i) => !later.includes(i) && !done.includes(i)).length;
  document.getElementById("count").textContent = live ? live + (live === 1 ? " thing needs you" : " things need you") : "Nothing needs you right now";
  const grid = document.getElementById("grid"), narrow = el("div", "stack"), wide = el("div", "stack"); grid.replaceChildren(narrow, wide);
  const known = new Set(MODULES.map(m => m.id));
  const order = layout.order.filter(id => known.has(id)).concat(MODULES.map(m => m.id).filter(id => !layout.order.includes(id)));
  for (const id of order) {
    if (layout.hidden.includes(id)) continue;
    if (id === "onboarding" && DATA.modules.onboarding.every(s => s.done)) continue;   // finished: nothing left to show
    const m = MODULES.find(x => x.id === id), sec = el("section", "mod"); sec.dataset.size = m.size; sec.dataset.tab = m.tab; sec.setAttribute("aria-label", m.title);
    if (m.tab === tab) sec.classList.add("tab-on");
    sec.style.order = order.indexOf(id);   // the phone shows one column, in the chosen order
    sec.append(el("h2", null, m.title)); RENDER[id](sec); (m.size === "narrow" ? narrow : wide).append(sec);
  }
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });

  const draw = () => { ul.replaceChildren();
    layout.order.forEach((id, i) => { const m = MODULES.find(x => x.id === id); if (!m) return;
      const li = el("li"), lab = el("label"), cb = el("input"); cb.type = "checkbox"; cb.checked = !layout.hidden.includes(id);
      cb.onchange = () => { layout.hidden = cb.checked ? layout.hidden.filter(x => x !== id) : layout.hidden.concat(id); saveLayout(); render(); };
      lab.append(cb, document.createTextNode(m.title));
      const up = el("button", "mv", "↑"), dn = el("button", "mv", "↓"); up.setAttribute("aria-label", "Move " + m.title + " up"); dn.setAttribute("aria-label", "Move " + m.title + " down");
      up.onclick = () => { if (i > 0) { [layout.order[i - 1], layout.order[i]] = [layout.order[i], layout.order[i - 1]]; saveLayout(); render(); draw(); } };
      dn.onclick = () => { if (i < layout.order.length - 1) { [layout.order[i + 1], layout.order[i]] = [layout.order[i], layout.order[i + 1]]; saveLayout(); render(); draw(); } };
      li.append(lab, up, dn); ul.append(li); }); };
  layout.order = layout.order.filter(id => MODULES.some(m => m.id === id)).concat(MODULES.map(m => m.id).filter(id => !layout.order.includes(id)));
  draw(); box.append(ul); s.append(box);
  const row = el("div", "row"), reset = el("button", "ghost", "Back to the default"), close = el("button", "primary calm", "Done");
  reset.onclick = () => { layout = {order: MODULES.map(m => m.id), hidden: []}; saveLayout(); render(); draw(); }; close.onclick = closeSheet;
  row.append(close, reset); s.append(row);
});
render();
</script>
</body>
</html>
