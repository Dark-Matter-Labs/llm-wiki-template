name: Monthly newsletter

# 09:00 UTC on the 2nd of each month, and on demand. Gathers the previous month's material
# deterministically (tools/newsletter.py — no model, no cost), then runs the `newsletter`
# skill to write the issue, and opens a PR. Nobody is sent anything: a person reads the PR,
# edits it, and decides where it goes.
#
# Replaces the weekly reflection's schedule, retired the same day. Eight reflections were
# produced between weeks 28 and 36; seven ordinary pages of 819 ever cited one, W35 and W36
# were written and never touched again, and five of fifteen runs failed — including
# 11 September, which nobody noticed. Weekly was the defect, not the prose.
#
# The 2nd rather than the 1st: `newsletter.py` reports the last COMPLETE month, and running
# on the 1st in a timezone behind UTC can land on the last day of the month it is meant to
# be summarising.
#
# Cost note: the write step calls the Claude API and is billed OUTSIDE the Claude plan
# (needs ANTHROPIC_API_KEY). The gather step is free and runs regardless, so the material
# is on the run page even when the write step is switched off.
on:
  schedule:
    - cron: "0 9 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to write, as YYYY-MM. Defaults to the last complete month."
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write        # required by claude-code-action for OIDC auth

concurrency:
  group: monthly-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the read-out reads git history for the window

      # Without a cached commons cut the material covers this wiki only, which is a much
      # thinner newsletter. Reading the orphan `export` branch keeps the boundary: it is
      # already filtered, so a private page in the commons cannot reach this runner.
      - name: Fetch the commons exports
        env:
          TOKEN: ${{ secrets.COMMONS_READ_TOKEN }}
          COMMONS: ${{ vars.COMMONS_REPO }}
        run: |
          COMMONS="${COMMONS:-Dark-Matter-Labs/xco-team-wiki}"
          if [ -z "${TOKEN}" ]; then
            echo "::notice::COMMONS_READ_TOKEN not set — the issue will cover this wiki only."
            exit 0
          fi
          mkdir -p ".commons/${COMMONS##*/}"
          if git clone --depth 1 --branch export \
               "https://x-access-token:${TOKEN}@github.com/${COMMONS}.git" \
               ".commons/${COMMONS##*/}/export" 2>/dev/null; then
            echo "Fetched the commons export from ${COMMONS}."
          else
            echo "::warning::No export branch on ${COMMONS} — the issue will cover this wiki only."
          fi

      # Free, deterministic, and always run. Putting the material on the run page means a
      # month with the write step switched off still leaves something a person can use.
      - name: Gather the month's material
        id: gather
        env:
          # Via env, never interpolated into the script: a workflow_dispatch input is
          # attacker-controllable by anyone who can dispatch, and `${{ }}` inside `run:`
          # is textual substitution — a crafted value would execute as shell.
          MONTH_IN: ${{ github.event.inputs.month }}
        run: |
          set -euo pipefail
          # Whitelist the shape before it reaches a command line. Anything else is refused
          # outright rather than sanitised, because a half-accepted date is a guess.
          ARG=""
          if [ -n "${MONTH_IN:-}" ]; then
            if printf '%s' "$MONTH_IN" | grep -qE '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
              ARG="--month $MONTH_IN"
            else
              echo "::error::month must look like YYYY-MM; got something else. Refusing to run."
              exit 1
            fi
          fi
          {
            echo "### Newsletter material"
            echo ""
            echo '```'
            python3 tools/newsletter.py $ARG
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/newsletter.py $ARG --json > /tmp/material.json
          echo "month=$(python3 -c "import json;print(json.load(open('/tmp/material.json'))['month'])")" >> "$GITHUB_OUTPUT"

      # A skipped run must never look like a completed one. That defect was found on
      # 2026-08-21, when two spokes had reported success every Friday while producing
      # nothing, and the only trace was a notice in a log nobody opens.
      - name: Check for API key
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "### No issue was written"
              echo ""
              echo "\`ANTHROPIC_API_KEY\` is not set, so the writing step did nothing."
              echo "The material above was still gathered and costs nothing."
              echo ""
              echo "To switch it on: \`gh secret set ANTHROPIC_API_KEY\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ANTHROPIC_API_KEY is not set - material gathered, no issue written."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the issue
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # MODEL AND BUDGET ARE PINNED, because neither was, and the default is the
          # most expensive configuration on offer. Left alone the action resolves to
          # `claude-opus-5[1m]` — Opus with a one-million-token context — which is what
          # the retired weekly reflection was quietly running on: $9.51 for one run on
          # 2026-09-04, $5.94 for the one that failed a week later. Ten wikis on that
          # footing is roughly $70 a month to write ten short pages.
          #
          # Sonnet, because the expensive part of Opus buys reasoning this job does not
          # need. `tools/newsletter.py` has already done every piece of arithmetic before
          # the model is invoked; what is left is judgement about what matters and prose
          # that reads as though a person wrote it. The million-token window is the part
          # that made no sense at all — the material arrives as one JSON file.
          #
          # The budget is a backstop, not a target: a run that hits it has gone wrong,
          # and stopping is cheaper than discovering why on the invoice. Measured
          # 2026-09-18 on the largest corpus in the federation (indy, 879 pages):
          # $1.74 and 54 turns, against $9.51 for the same shape of job on the old
          # default. Three dollars because $2 left fifteen per cent of headroom, and a
          # run cut off mid-write is worse than a slightly dearer one. The other nine
          # wikis are between 12 and 676 pages, so the cap will not bind on any of them.
          claude_args: --model claude-sonnet-5 --max-budget-usd 3 --allowedTools Bash,Read,Edit,Write,Glob,Grep
          prompt: |
            Run the `newsletter` skill for ${{ steps.gather.outputs.month }}. The gathered
            material is at /tmp/material.json and `python3 tools/newsletter.py --json` will
            reproduce it.

            WRITE into the working tree only: the issue at
            wiki/newsletter/${{ steps.gather.outputs.month }}.md, and an entry in today's
            log file. Do NOT git commit, push, or open a PR, and do NOT run gh — the next
            step does that. Do NOT send anything anywhere.

      # The write step can report success having done nothing at all. Found 2026-09-18:
      # the action refuses to run when the workflow file differs from the default
      # branch — a sensible protection against a branch rewriting what the action does
      # — and it announces that refusal as a WARNING, leaving the step green. The run
      # below it then opened a pull request titled "Newsletter — 2026-08" whose only
      # content was the workflow edit that had caused the skip.
      #
      # So the issue file is checked for directly. It is the artefact this job exists to
      # produce, and its absence is the only honest test of whether the job did its work.
      - name: Did the model actually write the issue?
        if: steps.guard.outputs.enabled == 'true'
        env:
          MONTH: ${{ steps.gather.outputs.month }}
        run: |
          if [ ! -f "wiki/newsletter/${MONTH}.md" ]; then
            {
              echo "### The writing step produced nothing"
              echo ""
              echo "No issue at \`wiki/newsletter/${MONTH}.md\`. The step above reported"
              echo "success, so read its log rather than trusting its colour — the"
              echo "action skips with a warning when the workflow file differs from the"
              echo "default branch, and a skip looks exactly like a pass."
              echo ""
              echo "The material was gathered and is in this run's summary regardless."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no issue written at wiki/newsletter/${MONTH}.md"
            exit 1
          fi
          echo "Issue present at wiki/newsletter/${MONTH}.md ($(wc -w < "wiki/newsletter/${MONTH}.md") words)."

      # The house gates, run against what the model just wrote.
      #
      # These already run on the pull request. What they did not do is colour the job
      # that produced the prose: on 2026-09-18 a newsletter run wrote a log entry with
      # eight em dashes, which `ai-detox` bans and `check_prose` refuses, and the run
      # reported success. The PR carried the failure instead, and main went red when
      # somebody merged it without reading the checks. That somebody had every reason
      # to look and did not, which is the argument for the job owning its own output
      # rather than passing the problem downstream. On the 2nd this runs unattended in
      # ten repositories at once and nobody reads ten sets of checks.
      #
      # The issue is committed and the PR opened either way. A run costs about a
      # dollar, the prose is nearly always worth keeping, and throwing the work away
      # over a punctuation mark would be its own kind of waste. The job simply stops
      # claiming to have succeeded: the PR says what failed, and the last step exits
      # non-zero after the work is safely pushed.
      - name: Check the issue against the house gates
        id: gates
        if: steps.guard.outputs.enabled == 'true'
        run: |
          rc=0
          fails=""
          for c in "check_prose.py --check" "house_rules.py --check" "check_log_shape.py" "sync_log_index.py --check"; do
            # shellcheck disable=SC2086
            if out=$(python3 tools/$c 2>&1); then
              echo "ok    $c"
            else
              echo "FAIL  $c"
              printf '%s\n' "$out" | tail -12 | sed 's/^/        /'
              fails="${fails}- \`$c\`"$'\n'
              rc=1
            fi
          done
          if [ "$rc" != "0" ]; then
            {
              echo "### The issue does not pass this wiki's own checks"
              echo ""
              printf '%s' "$fails"
              echo ""
              echo "The issue is still committed and the pull request still opened, so"
              echo "nothing is lost. Read the failures above, fix them on the branch, and"
              echo "the PR's own checks will confirm it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "failed=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit and open the PR
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.gather.outputs.month }}
          GATES_FAILED: ${{ steps.gates.outputs.failed }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the working tree counts. The old test also compared HEAD against
          # origin/main, which is true whenever the branch differs for ANY reason —
          # including a change to this very file — and that is how a PR carrying no
          # newsletter came to be labelled as one.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing written this run — no PR."
            exit 0
          fi
          # MONTH comes from newsletter.py, which only ever emits YYYY-MM — but it is
          # still a value reaching a branch name, so it is checked here too.
          printf '%s' "$MONTH" | grep -qE '^[0-9]{4}-(0[1-9]|1[0-2])$' || {
            echo "::error::unexpected month value from the gather step"; exit 1; }
          BRANCH="newsletter/${MONTH}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "newsletter: ${MONTH}" || echo "(already committed by the model)"
          # The Claude action reconfigures git auth during its run, so push with an
          # explicit token URL rather than the checkout's credentials.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          NOTE=""
          if [ "${GATES_FAILED}" = "1" ]; then
            NOTE=$'\n\n**This issue does not pass the wiki\'s own checks.** See the run summary for which ones. It is here rather than discarded because the prose is usually worth keeping; fix it on this branch.'
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Newsletter — ${MONTH}" \
            --body "Automated monthly issue. **Nothing has been sent.** Read it, edit it, then decide where it goes — the skill deliberately has no delivery path, because a newsletter a model can mail to the team without a person reading it first is a mailing list nobody consented to.${NOTE}"

      # Last, so the work is pushed before the job admits it went wrong.
      - name: Fail if the issue did not pass the gates
        if: steps.guard.outputs.enabled == 'true' && steps.gates.outputs.failed == '1'
        run: |
          echo "::error::the issue was written and the PR opened, but it does not pass this wiki's own checks - see the run summary"
          exit 1
