name: Weekly reflection

# Fridays 15:00 UTC (and on demand). Runs the `reflect` skill for the past week, then
# the `joker` method on the two largest deviations, and opens a PR with the results.
# The owner reviews and merges; merging fires the export workflow and updates the interface.
#
# Cost note: this step calls the Claude API and consumes API credits billed OUTSIDE
# the Claude Team plan (requires the ANTHROPIC_API_KEY secret). The export workflow is
# free; this one is not. Remove the schedule to make reflections manual-only.
on:
  schedule:
    - cron: "0 15 * * 5"   # 15:00 UTC every Friday
  workflow_dispatch:

permissions:
  contents: write        # create the reflection branch
  pull-requests: write   # open the PR
  issues: write
  id-token: write        # required by claude-code-action for OIDC auth

concurrency:
  group: weekly-reflect
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      # Skip cleanly when no API key is configured, rather than failing every Friday.
      # A weekly red X trains people to ignore CI, which is worse than no reflection —
      # and this job costs money, so running without a key is a legitimate steady state,
      # unlike the commons sync where it silently disables the whole down-flow.
      #
      # What DID need fixing (2026-08-21): a skipped run looked exactly like a completed
      # one. Two spokes had reported "success" every Friday since 14 August while
      # producing nothing, and the only trace was a notice in a log nobody opens. The
      # run summary below now states the outcome on the run page itself.
      - name: Check for API key
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No reflection was written"
              echo ""
              echo "\`ANTHROPIC_API_KEY\` is not set, so this job did nothing."
              echo "That is a supported state — the reflection calls the Claude API and is"
              echo "billed outside the Claude plan — but it means no weekly reflection and no"
              echo "contribution prompt for this wiki."
              echo ""
              echo "To switch it on: \`gh secret set ANTHROPIC_API_KEY\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ANTHROPIC_API_KEY is not set - no reflection was written."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "### Reflection ran" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # reflect reads git history for the week

      # The contribution prompt can only tell what the commons already holds if a
      # cached export is present. Without it the prompt is honest but useless — it
      # says "overlap UNKNOWN" every week, which is a prompt nobody can act on. This
      # repo has no sync-commons schedule of its own, so fetch the cut here. Reading
      # the orphan `export` branch (not the working tree) keeps the boundary: it is
      # already filtered, so a private page in the commons cannot reach this runner.
      - name: Fetch the commons export (so the contribution prompt can check overlap)
        env:
          TOKEN: ${{ secrets.COMMONS_READ_TOKEN }}
          COMMONS: ${{ vars.COMMONS_REPO }}
        run: |
          COMMONS="${COMMONS:-Dark-Matter-Labs/xco-team-wiki}"
          if [ -z "${TOKEN}" ]; then
            echo "::notice::COMMONS_READ_TOKEN not set — the contribution prompt will report overlap as unknown."
            exit 0
          fi
          mkdir -p ".commons/${COMMONS##*/}"
          if git clone --depth 1 --branch export                "https://x-access-token:${TOKEN}@github.com/${COMMONS}.git"                ".commons/${COMMONS##*/}/export" 2>/dev/null; then
            echo "Fetched the commons export from ${COMMONS}."
          else
            echo "::warning::No export branch on ${COMMONS} — overlap will report as unknown."
          fi

      - name: Run reflect + joker (writes files only)
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The action does not auto-open PRs in prompt mode, and its default tool
          # policy blocks git/file ops — so grant the tools reflect needs and let the
          # next step do the branch+PR deterministically.
          claude_args: |
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch
          prompt: |
            Run the reflect skill for the past week, then run the joker method on the
            two largest deviations. WRITE the results into the working tree only:
            the weekly reflection to wiki/reflections/ (visibility: unlisted), any joker
            briefs to wiki/challenges/ (visibility: private), and update wiki/index.md
            and the current month's log file (wiki/log/YYYY-MM.md). Do NOT git commit, push, or open a PR, and do NOT run gh —
            the workflow's next step commits your changes and opens the PR.

      - name: Commit changes and open the reflection PR
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Nothing produced (uncommitted or committed by the model)? Exit cleanly.
          if [ -z "$(git status --porcelain)" ] && git diff --quiet origin/main..HEAD; then
            echo "No reflection output this run — nothing to PR."
            exit 0
          fi
          BRANCH="reflection/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "reflect: weekly reflection + joker briefs" || echo "(already committed by the model)"
          # The Claude action reconfigures git auth during its run, so the checkout's
          # push credentials are gone by now. Push with an explicit token URL instead.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          gh pr create --base main --head "$BRANCH" \
            --title "Weekly reflection — $(date -u +%Y-%m-%d)" \
            --body "Automated weekly reflection (reflect + joker). Review and merge; nothing was pushed to main. Reflections are unlisted, joker briefs private."
