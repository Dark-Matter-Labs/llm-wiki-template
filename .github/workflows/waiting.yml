name: What's waiting for you

# Keeps ONE GitHub Issue up to date with everything that needs a person. The issue is the
# point: it is a web page with a title and some links, and it can be read by someone who
# does not know what a branch is. The terminal report exists for whoever wants it; this is
# the surface the system is actually for.
#
# Why it was built, 2026-09-15: one wiki in this federation had 61 branches, of which 37 had
# never had a pull request opened for them at all, the oldest from 4 July, carrying 66 wiki
# pages that existed there and nowhere else. Nothing was broken and no check had failed. The review
# queue was empty, which is exactly why nobody looked: the work was in the one place the
# system never shows anyone.
#
# It never opens a proposal, never merges, never deletes a branch. Sixty-six pages nobody
# has read since July are not obviously all wanted, and deciding that is a person's job.
# The workflow's only power is to write one issue body.

on:
  schedule:
    - cron: "0 8 * * 1"     # Mondays, 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # Required to ask which work already has a proposal. Without it the first real run
  # reported 55 pieces of unproposed work against a true 37, because the query came back
  # empty and empty looked like "none have ever been proposed". The tool now refuses to
  # produce that list at all when it cannot ask — but the permission is the actual fix.
  pull-requests: read

concurrency:
  group: waiting
  cancel-in-progress: false

jobs:
  waiting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the report diffs every branch against main

      # A public repository gets the list without the NAME of any decision page that is not
      # itself public. The page that closes a question is usually private, and its title was
      # going into an issue body with nothing in the path asking what tier it was. Asked of
      # GitHub at run time rather than read off the event payload, so it is the same answer
      # whether the run was scheduled or dispatched, and it fails closed: if the question
      # cannot be answered, the safe flag is passed.
      # Without this the commons cut is absent and `contributed_but_gone` reports
      # "unavailable" every week — a section that renders nothing, in a report nobody
      # would know was incomplete. Built on 2026-09-18 and caught the same hour: the
      # check existed, ran, and could never once have fired.
      #
      # The orphan `export` branch is already boundary-filtered, so a private page in
      # the commons cannot reach this runner.
      - name: Fetch the commons exports
        env:
          TOKEN: ${{ secrets.COMMONS_READ_TOKEN }}
          COMMONS: ${{ vars.COMMONS_REPO }}
        run: |
          set -u
          if [ -z "${TOKEN}" ]; then
            echo "::notice::COMMONS_READ_TOKEN not set - the commons checks cannot run."
            exit 0
          fi
          # WHICH commons is the wiki's own declaration, not a repo variable.
          #
          # This fetched a single `COMMONS_REPO` until 2026-09-18, and indy contributes to
          # two. So the second one reported "whether it already holds them could not be
          # checked" every week, permanently — an honest unknown, but a permanently
          # unknowable one is halfway back to a section that cannot fire. `contributes_to`
          # in design/federation.json is the same list sync_commons.py reads locally, so
          # the weekly run and the local tool now answer from the same source.
          #
          # Still the orphan `export` branch, one shallow clone each. That branch is already
          # boundary-filtered, so a private page in a commons cannot reach this runner —
          # which is why this does not simply call sync_commons.py, since that clones whole
          # repositories and is written for a laptop that already has access.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ -n "${COMMONS:-}" ]; then
            TARGETS="${COMMONS}"
          else
            TARGETS=$(OWNER="$OWNER" python3 -c 'import json,os,pathlib; p=pathlib.Path("design/federation.json"); ns=(json.loads(p.read_text()).get("contributes_to") or []) if p.exists() else []; o=os.environ["OWNER"]; print(" ".join(n if "/" in n else o+"/"+n for n in ns))')
          fi
          if [ -z "${TARGETS}" ]; then
            echo "::notice::this wiki declares no commons in design/federation.json - nothing to fetch."
            exit 0
          fi
          for C in ${TARGETS}; do
            mkdir -p ".commons/${C##*/}"
            if git clone --depth 1 --branch export \
                 "https://x-access-token:${TOKEN}@github.com/${C}.git" \
                 ".commons/${C##*/}/export" 2>/dev/null; then
              echo "Fetched the commons export from ${C}."
            else
              echo "::warning::No export branch on ${C} - its checks cannot run."
            fi
          done

      - name: Work out what is waiting
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          private=$(gh repo view "$REPO" --json isPrivate -q .isPrivate 2>/dev/null || echo "")
          if [ "$private" = "true" ]; then safe=""; else safe="--public-safe"; fi
          echo "repository private: ${private:-unknown} -> ${safe:-titles shown}"
          python3 tools/waiting.py --markdown $safe > /tmp/body.md
          {
            echo "### What's waiting"
            echo ""
            cat /tmp/body.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept as one issue, updated in place, rather than a new issue each week: a weekly
      # issue is a notification stream, and the last thing this needs is to become another
      # feed nobody reads. One page, one URL, always current.
      - name: Put it in the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: "What's waiting for you"
        run: |
          set -euo pipefail
          num=$(gh issue list -R "$REPO" --state open --limit 50 \
                  --json number,title \
                  --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue edit "$num" -R "$REPO" --body-file /tmp/body.md
            echo "updated issue #$num"
          else
            url=$(gh issue create -R "$REPO" --title "$TITLE" --body-file /tmp/body.md)
            echo "opened $url"
          fi
