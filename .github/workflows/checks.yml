name: Wiki checks

# These run on every pull request. The house-rule gate was first added to
# validation-pass.yml, which is a daily cron — a gate that only fires on a
# schedule is not a gate, so this file exists to give the repo a real one.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CLAUDE.md's generated block matches this repo
        # The retrieval order and the federation facts are generated from design/federation.json
        # and the corpus. Hand-copied guidance is how nine wikis ended up six weeks out of date
        # on how to search their own pages.
        run: python3 tools/wiki_context.py --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: This wiki's own configuration is coherent
        # Three failures that look like success: a wiki still named llm-wiki-template, which
        # contributes as the template; a commons running the spoke exporter, which publishes an
        # empty public graph while every spoke is told the sync succeeded; and a colleague
        # mirror still titled "this LLM Wiki". All three parse, run and pass every other gate.
        # Reports which checks its role skipped, so a vacuous pass stays visible.
        run: python3 tools/init_wiki.py --check
      - name: House rules — civilization with a z, xCO with a lowercase x
        # From xco-style-guide#11. Skips raw/, generated exports, blockquotes,
        # slugs and paths — see tools/house_rules.py. No untrusted input.
        run: python3 tools/house_rules.py --check

      - name: House-rule linter edge cases
        run: python3 tools/test_house_rules.py

      - name: Log shape — entries in day files, month files are indexes
        run: python3 tools/check_log_shape.py

      - name: Log index matches the day files
        # The month row is a projection of the day files, so it is generated, never
        # typed. This catches a forgotten `python3 tools/sync_log_index.py`.
        run: python3 tools/sync_log_index.py --check

      - name: No model is standing in for a person
        run: python3 tools/cross_check.py --check

      - name: Frontmatter parses as YAML
        # Every tool in this repo reads frontmatter with a forgiving regex, so a page only
        # this federation can parse looks perfectly healthy from the inside. 28 such pages
        # existed across four wikis on 2026-09-18 and nothing had ever complained —
        # including the step below, which passed on all of them.
        run: python3 tools/check_frontmatter.py --check

      - name: Frontmatter gate's own cases
        run: python3 tools/test_check_frontmatter.py

      - name: The Monday fetch step's own cases
        run: bash tools/test_waiting_fetch.sh

      - name: same_as stays inside the boundary
        run: python3 tools/check_same_as.py --check

      - name: The same_as gate's own cases
        run: python3 tools/test_check_same_as.py

      - name: Schema — frontmatter, types, commitment states
        # Renamed 2026-08-31. This step was called "Schema + link integrity" and did not check
        # link integrity: it catches a link wrapped across a newline and nothing else. A broken
        # target passed it silently, because export.py drops unresolvable edges while building
        # the graph. The link check is its own step.
        run: python3 tools/export.py --check

      - name: Wiki-links resolve
        # Every [[link]] must point at a page that exists. Code spans are excluded — these wikis
        # write about the link syntax as often as they use it. Existing dead links are baselined;
        # this fails on anything new.
        run: python3 tools/check_links.py --check

      - name: Design tokens keep their own accessibility contract
        # Generated CSS must match design/xco.tokens.json, and every text token
        # must clear its contrast floor in both registers.
        run: python3 tools/test_tokens.py

      # Discovered, not listed. This step used to name each test file by hand, and on
      # 2026-09-04 an audit found that HALF of every wiki's test suite had never run in CI:
      # written, passing locally, and silently unwired. A list a human must remember to
      # extend is a gate that fails open. Every tools/test_*.py now runs, so writing the
      # file is enough to arm it.
      # The boundary suites this replaced carried their own note, kept here because the
      # intent outlives the step: they prove the tier invariants hold — private leaks
      # into nothing; internal reaches the colleague cut but never the web.
      # ── Added 2026-09-21. Four gates existed as tools here and were never wired into
      # this workflow, so `gates.py` reported green while they were failing. That gap was
      # found in xco-team-wiki, where `check_prose --check` was failing and only the
      # discovered tool-test step caught it. Audited across all eleven wikis: ten were
      # missing the same four. Each was run in each repo before being wired, so none of
      # them arrives red.
      - name: Prose ratchet
        # The mechanical half of ai-detox. Counts may fall and never rise, and a new file
        # must be clean. Not a style opinion: a ratchet over the corpus.
        run: python3 tools/check_prose.py --check

      - name: Onboarding guide names what exists
        # ONBOARDING.md tells a new contributor what to run. A guide naming a tool or a
        # workflow this repo no longer has is worse than no guide.
        run: python3 tools/check_onboarding.py --check

      - name: Skill links resolve
        # A skill that points at a missing page or a tool that was renamed fails silently
        # at the moment somebody is relying on it.
        run: python3 tools/check_skill_links.py --check

      - name: Contradictions are declared, not dangling
        # A `contradicts:` naming a page that does not exist is a disagreement pointing at
        # nothing. Declaring is a model's job; resolving is a person's; neither is served
        # by a broken pointer.
        run: python3 tools/contradictions.py --check

      - name: Tool tests
        run: |
          set -o pipefail
          failed=""
          shopt -s nullglob
          files=(tools/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tools/test_*.py found — the discovery glob is broken, not the corpus"
            exit 1
          fi
          echo "discovered ${#files[@]} test suites"
          for f in "${files[@]}"; do
            if python3 "$f" > /tmp/out.txt 2>&1; then
              echo "  ok    $f"
            else
              echo "  FAIL  $f"; sed 's/^/        /' /tmp/out.txt; failed="$failed $f"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"; exit 1
          fi

      - name: Sensitive-terms scan on public surfaces
        run: python3 tools/scan_public_leaks.py
