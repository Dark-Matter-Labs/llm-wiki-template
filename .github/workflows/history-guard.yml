name: History guard

# Pages retire, they are not deleted; past log days only grow. Both rules were written down and
# enforced by nothing until 2026-09-29 (awesome-llm-wiki review). Replayed over 118 merged pull
# requests in indy-llm-wiki, it would have stopped one: an edit to a past day's log.
#
# A person approves a real removal by adding the label `approved-removal` to the pull request.
# Adding or removing the label re-runs this check. A model never adds the label itself.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No deleted pages, no rewritten past log days
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'approved-removal') }}
        run: |
          if [ "$APPROVED" = "true" ]; then
            python3 tools/check_history.py --base "$BASE" --approved
          else
            python3 tools/check_history.py --base "$BASE"
          fi
