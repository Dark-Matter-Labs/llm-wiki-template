name: Weekly digest

# 06:00 UTC every Thursday, and on demand. The Thursday digest in d.INO's weekly rhythm:
# what moved in this wiki in the last seven days, counted by tools/weekly_digest.py from the
# wiki's own history. No model and no API key, so it runs in every wiki.
#
# It opens a proposed change and never saves to main, and closes last week's if it was never saved.
# A week in which no page moved writes nothing and opens nothing. One short job: about a minute a run.
on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Last day of the week, as YYYY-MM-DD. Defaults to today."
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # to approve the proposal's waiting checks run (see "Open the proposal")

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The bookkeeper App's key lives in a `bookkeeper` environment that allows main only, set up so far only in
    # the wikis whose bookkeeping is derived. Named only there: naming it in any other wiki would create an empty one.
    environment: ${{ github.ref == 'refs/heads/main' && vars.BOOKKEEPER_APP_ID != '' && 'bookkeeper' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the digest compares this week's pages with last week's
          persist-credentials: false

      # So "could go up" can say what the commons already holds. Without the token the
      # section says it could not check, rather than guessing. Same step as the newsletter's.
      - name: Fetch the commons exports
        env:
          TOKEN: ${{ secrets.COMMONS_READ_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::notice::COMMONS_READ_TOKEN not set; the digest will not check what the commons holds."
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          TARGETS=$(python3 -c "import sys; sys.path.insert(0,'tools'); import sync_commons; print('\n'.join(sync_commons.declared()))")
          for NAME in $TARGETS; do
            printf '%s' "$NAME" | grep -qE '^[A-Za-z0-9._-]+$' || { echo "::error::bad commons name"; exit 1; }
            DEST=".commons/${NAME}/export"
            mkdir -p "$(dirname "$DEST")"
            if git -c http.https://github.com/.extraheader= clone --quiet --depth 1 --branch export \
                 "https://x-access-token:${TOKEN}@github.com/${OWNER}/${NAME}.git" "$DEST" 2>/dev/null; then
              git -C "$DEST" remote set-url origin "https://github.com/${OWNER}/${NAME}.git"
            else
              echo "::warning::Could not read the export branch of ${NAME}."
            fi
          done

      - name: Write the digest
        id: write
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, never interpolated into the script: a dispatch input is text anyone who
          # can dispatch controls.
          WEEK_IN: ${{ github.event.inputs.week_ending }}
          # Only whether a Slack address is set, never the address: the address stays in the step that sends.
          TO_SLACK: ${{ secrets.SLACK_DIGEST_WEBHOOK != '' }}
        run: |
          set -euo pipefail
          WEEK="${WEEK_IN:-$(date -u +%F)}"
          printf '%s' "$WEEK" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || {
            echo "::error::week_ending must look like YYYY-MM-DD"; exit 1; }
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          # With a Slack address set, the week goes to its owner in Slack, with no private title, and no
          # proposal is opened (24 Nov 2026: owners did not open the proposals). Without one, nothing changes.
          if [ "$TO_SLACK" = "true" ]; then
            python3 tools/weekly_digest.py --week-ending "$WEEK" --slack > /tmp/slack.json
            echo "Slack version written ($(wc -c < /tmp/slack.json) bytes); private pages are counted, not named." >> "$GITHUB_STEP_SUMMARY"
            if grep -q '"text"' /tmp/slack.json; then echo "slack=true" >> "$GITHUB_OUTPUT"; fi
            echo "written=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/weekly_digest.py --week-ending "$WEEK" --write | tee -a "$GITHUB_STEP_SUMMARY"
          # A tiered index counts synthesis pages, and the digest is one.
          if [ -f tools/sync_index_counts.py ]; then python3 tools/sync_index_counts.py > /dev/null; fi
          if [ -n "$(git status --porcelain -- wiki/digest)" ]; then
            echo "written=true" >> "$GITHUB_OUTPUT"
          else
            echo "written=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the week to its owner in Slack
        if: steps.write.outputs.slack == 'true'
        env:
          HOOK: ${{ secrets.SLACK_DIGEST_WEBHOOK }}
        run: |
          # A Slack workflow the owner made, which sends its "text" to them alone. Only this wiki holds its address.
          # A pasted address often carries a line break or spaces (24 Nov 2026: the first pilot run failed on one).
          HOOK="$(printf '%s' "$HOOK" | tr -d '[:space:]')"
          case "$HOOK" in
            https://hooks.slack.com/*) ;;
            *) echo "::error::SLACK_DIGEST_WEBHOOK does not look like a Slack webhook address (https://hooks.slack.com/...). Save it again."; exit 1 ;;
          esac
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' --data @/tmp/slack.json "$HOOK" \
            && echo "Sent to the owner in Slack." \
            || { echo "::error::Slack did not accept the digest; check the address saved as SLACK_DIGEST_WEBHOOK"; exit 1; }

      # The gates that read a page run here too, so the proposal can say at once how they went.
      - name: Check the digest
        id: gates
        if: steps.write.outputs.written == 'true'
        run: |
          rc=0
          for t in check_frontmatter house_rules check_prose check_links; do
            if [ -f "tools/$t.py" ]; then python3 "tools/$t.py" --check >> /tmp/gates.txt 2>&1 || rc=1; fi
          done
          python3 tools/export.py --check >> /tmp/gates.txt 2>&1 || rc=1
          if [ -f tools/sync_index_counts.py ]; then python3 tools/sync_index_counts.py --check >> /tmp/gates.txt 2>&1 || rc=1; fi
          tail -20 /tmp/gates.txt
          echo "failed=$rc" >> "$GITHUB_OUTPUT"

      # GitHub holds the checks of a proposal opened with the job's own token until a person approves them
      # (19 Nov 2026: seven digests blocked). A proposal opened by the App starts its checks like anyone's.
      # Asking for pull requests too means that, until the App holds that permission, this step fails and
      # the job opens the proposal with its own token, as before.
      - name: Mint the bookkeeper token
        id: app
        if: steps.write.outputs.written == 'true' && github.ref == 'refs/heads/main' && vars.BOOKKEEPER_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOOKKEEPER_APP_ID }}
          private-key: ${{ secrets.BOOKKEEPER_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the proposal
        if: steps.write.outputs.written == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}   # empty without the App: the job's own token is used
          WEEK: ${{ steps.write.outputs.week }}
          GATES_FAILED: ${{ steps.gates.outputs.failed }}
        run: |
          set -euo pipefail
          OUTSIDE=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -vE '^wiki/(digest/|index\.md$|index/)' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::files outside the digest and the index changed, so nothing is committed:"; echo "$OUTSIDE"; exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="digest/${WEEK}"
          git checkout -b "$BRANCH"
          git add -A wiki
          git commit -m "digest: week ending ${WEEK}"
          git push "https://x-access-token:${APP_TOKEN:-$GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "This week's digest, counted from the wiki's history with no model. Read it, and say yes to save it."
            echo ""
            if [ "${GATES_FAILED}" = "1" ]; then
              echo "**The digest does not pass this wiki's page checks.** The run page says which."
            else
              echo "The page checks were run on it before this was opened, and passed."
            fi
            echo ""
            if [ -n "${APP_TOKEN}" ]; then
              echo "The wiki's full checks start on it as on any other proposal."
            else
              echo "If its full checks show as waiting, someone who can change this wiki approves them here first."
            fi
          } > /tmp/pr-body.md
          # Only the opening needs the App: its other calls below keep the job's own token and permissions.
          NEW_URL=$(GH_TOKEN="${APP_TOKEN:-$GH_TOKEN}" gh pr create --base main --head "$BRANCH" --title "Weekly digest, week ending ${WEEK}" --body-file /tmp/pr-body.md)
          echo "$NEW_URL"
          # GitHub holds the checks of a proposal this job opens at "waiting for approval", and main needs
          # "checks" to pass. A run started by hand does not count for the proposal; approving the waiting one
          # does (19 Nov 2026). So the job approves its own proposal's run, and says so when it cannot.
          FOUND=""
          for _ in 1 2 3 4 5 6; do
            sleep 10
            FOUND=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f event=pull_request -f branch="$BRANCH" \
                      -q '.workflow_runs[] | select(.path == ".github/workflows/checks.yml") | "\(.id) \(.conclusion)"' \
                      | head -1 || true)
            [ -n "$FOUND" ] && break
          done
          RUN="${FOUND%% *}"
          if [ -z "$RUN" ]; then
            echo "::warning::no checks run appeared on ${BRANCH}; run Wiki checks on it by hand"
          elif [ "${FOUND#* }" != "action_required" ]; then
            echo "The checks run ${RUN} started without waiting; nothing to approve."
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/approve" > /dev/null; then
            echo "Approved the waiting checks run ${RUN}."
          else
            echo "::warning::could not approve the waiting checks; a person can approve run ${RUN} on its run page"
          fi
          # Only the latest digest waits for a yes. Unsaved ones piled up in eight wikis by 16 November
          # 2026 and hid the proposals that matter. A closed one can be reopened from its page, and any
          # week can be rebuilt with weekly_digest.py --week-ending.
          OLD=$(gh pr list --state open --limit 50 --json number,headRefName \
                  -q ".[] | select(.headRefName | startswith(\"digest/\")) | select(.headRefName != \"${BRANCH}\") | .number")
          for N in $OLD; do
            gh pr close "$N" --comment "Replaced by this week's digest: ${NEW_URL}. Only the latest digest waits for a yes. This one can be reopened here if you still want it saved." || \
              echo "::warning::could not close the earlier digest #${N}"
          done

      - name: Fail if the digest did not pass the checks
        if: steps.write.outputs.written == 'true' && steps.gates.outputs.failed == '1'
        run: |
          echo "::error::the digest was written and proposed, but does not pass this wiki's page checks"
          exit 1
