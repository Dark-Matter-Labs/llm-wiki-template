name: Deploy docs to GitHub Pages

# Deploys the /docs site to GitHub Pages via GitHub Actions, replacing the
# implicit "Deploy from a branch" builder. Runs on every push to main that
# touches docs/, and can be run on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "wiki/**"
      - "tools/needs_you.py"
      - "tools/build_needs_you_page.py"
      - "tools/view_modules.py"
      - "tools/templates/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "20 5 * * *"   # daily, so the Needs-you page stays fresh on quiet days
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # For the Needs-you page: which proposals are waiting, and whether their checks passed.
  pull-requests: read
  checks: read
  statuses: read
  actions: read

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the Needs-you page reads the history (growth, overview age, unsaved work)

      - name: Block deploy if sensitive material is on a public surface
        # Tripwire: fails (and stops the deploy) if any never-public term from
        # tools/sensitive_terms.txt appears anywhere under docs/. No untrusted input.
        run: python3 tools/scan_public_leaks.py

      - name: Block deploy on design-standard errors
        # ERROR-level findings only (missing link preview, a skip link pointing at
        # nothing, duplicate landmarks) — the things that are broken rather than
        # merely imperfect. WARNs are reported but never block.
        #
        # This gate exists because the standard drifted: seven pages added after the
        # last manual sweep shipped without it. A standard nobody enforces is a
        # preference. No untrusted input.
        run: python3 tools/audit_design.py --check

      - name: Build the Needs-you page, locked
        # Added 2026-10-12. The page carries this wiki's private items, so it is only ever published
        # locked: build_needs_you_page.py --lock encrypts it and refuses to leave anything readable.
        # With no password set, nothing is built and nothing is published for it. Generated here,
        # never saved in the wiki. The heading comes from design/federation.json.
        env:
          NEEDS_YOU_PASSWORD: ${{ secrets.NEEDS_YOU_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NEEDS_YOU_PASSWORD" ]; then
            echo "::notice::No NEEDS_YOU_PASSWORD set, so no Needs-you page is published."
            exit 0
          fi
          python3 tools/export.py >/dev/null
          python3 tools/build_needs_you_page.py --lock docs/needs-you/index.html

      - name: Configure Pages
        # enablement: true switches the Pages source to "GitHub Actions" so this
        # workflow becomes the active deployer.
        #
        # This step CANNOT self-enable Pages where the org/plan disallows it or the
        # token lacks permission — the normal state of a wiki freshly created from the
        # template. Rather than failing on every push until someone enables Pages, it
        # is allowed to fail and the deploy steps skip. A workflow that is red by
        # default trains people to ignore CI, and the two gates above — which are the
        # checks that actually matter — still run unconditionally.
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Report that Pages is not enabled
        if: steps.configure.outcome == 'failure'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository - skipping the deploy."
          echo "The site is optional. To publish pages, enable Pages under"
          echo "Settings > Pages, set the source to 'GitHub Actions', then re-run this workflow."

      - name: Count public pages with SimpleAnalytics (only where this wiki opted in)
        # Cookieless and aggregate. Locked pages are never counted. design/analytics.json turns it on; without it
        # this does nothing. Changes only the copy being published, never the pages in the wiki.
        run: python3 tools/add_analytics.py --write docs

      - name: Upload /docs as the Pages artifact
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v5
